name: Deploy to GitHub Pages

# Builds develop and publishes build/ to the gh-pages branch,
# which GitHub Pages serves at www.athulmurali.com (see public/CNAME).
on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-platform

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      # gh-pages commits with the git config identity (its -u option can't parse "[bot]" names)
      # and pushes from its own clone, which doesn't inherit checkout's credentials, so pass
      # an authenticated repo URL.
      - name: Deploy with gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx gh-pages -d build -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
